<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="./manifest.webmanifest"><title>XAUUSD Trading Timer</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:700px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px}.clock{color:#94a3b8}.card{background:#121a2d;border:1px solid #293752;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.timer{background:#0e1628;border:1px solid #293752;border-radius:14px;padding:13px;text-align:center}.m5{grid-column:1/-1}.tf{color:#94a3b8}.remain{font-size:29px;font-weight:800;margin-top:5px}.m5 .remain{font-size:43px}.session{border-radius:14px;padding:13px;margin:9px 0;border:1px solid #ef4444;background:#281317}.session.open{border-color:#22c55e;background:#10251b}.head{font-weight:800}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:7px}.open .dot{background:#22c55e}.time{margin-top:6px;color:#d3dae6}</style><!-- deployment trigger 2026-10-07 --> </head><body><main><div class="top"><h1>XAUUSD Trading Timer</h1><div class="clock" id="clock"></div></div><section class="card"><b>⏱ Time to candle close</b><div class="grid" id="timers"></div></section><section class="card"><b>🌍 Sessions · český čas</b><div class="session" id="asia"><div class="head"><span class="dot"></span>🌏 Asia / Tokyo · <span class="state">CLOSED</span></div><div class="time">02:00 – 11:00 🇨🇿</div></div><div class="session" id="london"><div class="head"><span class="dot"></span>🇬🇧 London · <span class="state">CLOSED</span></div><div class="time">09:00 – 18:00 🇨🇿</div></div><div class="session" id="ny"><div class="head"><span class="dot"></span>🇺🇸 New York · <span class="state">CLOSED</span></div><div class="time">14:00 – 23:00 🇨🇿</div></div></section></main><script>const tfs={M5:5,M15:15,M30:30,H1:60,H4:240,D1:1440},box=document.getElementById('timers'),pad=n=>String(n).padStart(2,'0');Object.entries(tfs).forEach(([n])=>{let d=document.createElement('div');d.className='timer '+(n==='M5'?'m5':'');d.innerHTML='<div class="tf">'+n+'</div><div class="remain" id="r'+n+'">--:--</div>';box.appendChild(d)});function fmt(ms){let s=Math.ceil(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return h?pad(h)+':'+pad(m)+':'+pad(s):pad(m)+':'+pad(s)}function update(){let now=new Date(),m=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;document.getElementById('clock').textContent=now.toLocaleTimeString('cs-CZ');Object.entries(tfs).forEach(([n,p])=>{let q=p*60000;document.getElementById('r'+n).textContent=fmt(q-(Date.now()%q))});[['asia',120,660],['london',540,1080],['ny',840,1380]].forEach(([id,a,b])=>{let e=document.getElementById(id),o=m>=a&&m<b;e.classList.toggle('open',o);e.querySelector('.state').textContent=o?'OPEN':'CLOSED'}))}update();setInterval(update,250)</script></body></html>
