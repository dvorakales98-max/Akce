<style>
:root{
  --paper:#F4F2ED; --surface:#FFFFFF; --surface-2:#EDEAE4;
  --ink:#1B1A1E; --ink-2:#46424C; --muted:#7A747F;
  --line:#DCD6CF; --line-soft:#E7E2DB;
  --c-music:#2E4FA8; --c-music-s:#E2E7F6;
  --c-culture:#0E6B75; --c-culture-s:#DCECEE;
  --c-market:#2F6B45; --c-market-s:#DFEDE4;
  --c-food:#93304C; --c-food-s:#F7E2E8;
  --c-sport:#B25812; --c-sport-s:#F8E7D6;
  --c-demo:#6A3670; --c-demo-s:#EEE2EF;
  --c-nature:#5B6B1E; --c-nature-s:#E9EEDA;
  --red:#BE3327; --red-s:#F6E4E1;
}
body[data-mode="dark"]{
  --paper:#131216; --surface:#1C1A20; --surface-2:#232128;
  --ink:#F1EEE9; --ink-2:#C3BDC7; --muted:#8B848F;
  --line:#302D37; --line-soft:#282530;
  --c-music:#94A5EC; --c-music-s:#1C2039;
  --c-culture:#5FBCC6; --c-culture-s:#122A2D;
  --c-market:#79C596; --c-market-s:#152A1E;
  --c-food:#E88BA5; --c-food-s:#321B23;
  --c-sport:#EFA05E; --c-sport-s:#2F2013;
  --c-demo:#C193C4; --c-demo-s:#2A1D2C;
  --c-nature:#B4C46A; --c-nature-s:#232815;
  --red:#EC7466; --red-s:#37211F;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
.top{
  flex:none;background:var(--paper);border-bottom:1px solid var(--line);
  padding:8px 12px 8px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;gap:7px;z-index:500;
}
.r1{display:flex;align-items:center;gap:10px}
.r1 h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.08rem;margin:0;letter-spacing:-.02em}
.r1 .sub{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spacer{margin-left:auto}
.iconbtn{
  width:32px;height:32px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-2);cursor:pointer;
}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{
  display:flex;gap:6px;align-items:center;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);
}
.row::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-family:"IBM Plex Sans",sans-serif;font-size:12px;font-weight:600;
  padding:5px 10px;border-radius:999px;border:1px solid transparent;
  background:var(--surface-2);color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background .14s,color .14s;
}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.chip[data-t="music"]{background:var(--c-music-s);color:var(--c-music)}
.chip[data-t="culture"]{background:var(--c-culture-s);color:var(--c-culture)}
.chip[data-t="market"]{background:var(--c-market-s);color:var(--c-market)}
.chip[data-t="food"]{background:var(--c-food-s);color:var(--c-food)}
.chip[data-t="sport"]{background:var(--c-sport-s);color:var(--c-sport)}
.chip[data-t="demo"]{background:var(--c-demo-s);color:var(--c-demo)}
.chip[data-t="nature"]{background:var(--c-nature-s);color:var(--c-nature)}
.chip[aria-pressed="true"]{color:#fff;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px currentColor}
body[data-mode="dark"] .chip[data-t][aria-pressed="true"]{color:#131216}
.chip[data-t="music"][aria-pressed="true"]{background:var(--c-music)}
.chip[data-t="culture"][aria-pressed="true"]{background:var(--c-culture)}
.chip[data-t="market"][aria-pressed="true"]{background:var(--c-market)}
.chip[data-t="food"][aria-pressed="true"]{background:var(--c-food)}
.chip[data-t="sport"][aria-pressed="true"]{background:var(--c-sport)}
.chip[data-t="demo"][aria-pressed="true"]{background:var(--c-demo)}
.chip[data-t="nature"][aria-pressed="true"]{background:var(--c-nature)}
.chip.plain[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.daytab{
  flex:none;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;
  padding:5px 9px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
.daytab .num{font-weight:400;color:var(--muted);margin-left:3px}
.daytab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.daytab[aria-pressed="true"] .num{color:var(--paper);opacity:.65}
.daytab.today{border-color:var(--red);color:var(--red)}
.daytab.today[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
select{
  flex:none;font-family:"IBM Plex Sans",sans-serif;font-size:12px;
  padding:4px 8px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;max-width:190px;
}
.count{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);white-space:nowrap;padding-right:6px}

#map{flex:1;min-height:0;background:var(--surface-2);z-index:1}
.leaflet-container{font-family:"IBM Plex Sans",sans-serif;background:var(--surface-2)}
body[data-mode="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) saturate(.75)}
body[data-mode="dark"] .leaflet-control-attribution{background:rgba(20,20,24,.75);color:#8B848F}
body[data-mode="dark"] .leaflet-control-attribution a{color:#A9A2AE}
.leaflet-control-attribution{font-size:9.5px}
.leaflet-bar a{background:var(--surface);color:var(--ink-2);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--surface-2)}

.pin{position:relative;width:30px;height:38px}
.pin svg.body{position:absolute;inset:0;width:30px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin svg.ico{position:absolute;left:8px;top:6.5px;width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pin.sel{z-index:1000!important}
.pin.sel svg.body{transform:scale(1.22);transform-origin:50% 100%}
.cluster{
  width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:#fff;
  border:2.5px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.cluster.big{width:46px;height:46px;font-size:14px}
.me{width:18px;height:18px;border-radius:999px;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.22),0 2px 6px rgba(0,0,0,.35)}

.card{
  position:absolute;left:10px;right:10px;z-index:600;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 14px 40px rgba(0,0,0,.35);
  display:flex;gap:12px;padding:10px;align-items:center;cursor:pointer;
  transform:translateY(18px);opacity:0;pointer-events:none;transition:transform .18s,opacity .18s;
}
.card.on{transform:none;opacity:1;pointer-events:auto}
.card .thumb{width:58px;height:58px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.card .thumb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card .mc{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.card b{font-family:"Bricolage Grotesque",sans-serif;font-size:.98rem;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.card small{color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
.card .go{flex:none;color:var(--muted)}
.card .go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;inset:0;z-index:900;display:none;flex-direction:column;justify-content:flex-end}
.sheet.open{display:flex}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheetbox{
  position:relative;background:var(--paper);border-radius:18px 18px 0 0;
  max-height:92vh;overflow-y:auto;box-shadow:0 -10px 50px rgba(0,0,0,.5);
  transform:translateY(100%);transition:transform .24s cubic-bezier(.22,.8,.3,1);
}
.sheet.on .sheetbox{transform:none}
@media (min-width:720px){
  .sheet{justify-content:center;align-items:center;padding:24px}
  .sheetbox{border-radius:18px;max-width:640px;width:100%;max-height:88vh}
}
.hero{position:relative;height:170px;display:flex;align-items:flex-end;padding:16px;overflow:hidden;border-radius:18px 18px 0 0}
.hero .glyph{position:absolute;right:-14px;top:-26px;opacity:.28}
.hero .glyph svg{width:190px;height:190px;stroke:#fff;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 34%,rgba(0,0,0,.62) 100%)}
.hero .ht{position:relative;color:#fff;display:flex;flex-direction:column;gap:6px}
.hero .kicker{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.92;display:inline-flex;align-items:center;gap:6px}
.hero .kicker svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1.35rem,5.2vw,2rem);line-height:1.05;letter-spacing:-.025em;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.sheetclose{position:absolute;right:12px;top:12px;z-index:3;width:34px;height:34px;border-radius:999px;border:0;cursor:pointer;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center}
.sheetclose svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;background:var(--line-soft);border-bottom:1px solid var(--line-soft)}
.qi{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.qi b{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.qi span{font-family:"Bricolage Grotesque",sans-serif;font-size:1rem;font-weight:600;line-height:1.15}
.qi small{color:var(--ink-2);font-size:11.5px;line-height:1.3}
.body{padding:16px 18px 28px;display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
.fact{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.fact svg{width:16px;height:16px;flex:none;margin-top:2.5px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fact .sub{color:var(--muted);font-size:12.5px}
.desc{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:4px}
.tag svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.k-music{background:var(--c-music-s);color:var(--c-music)} .k-culture{background:var(--c-culture-s);color:var(--c-culture)}
.k-market{background:var(--c-market-s);color:var(--c-market)} .k-food{background:var(--c-food-s);color:var(--c-food)}
.k-sport{background:var(--c-sport-s);color:var(--c-sport)} .k-demo{background:var(--c-demo-s);color:var(--c-demo)}
.k-nature{background:var(--c-nature-s);color:var(--c-nature)} .k-local{background:var(--red-s);color:var(--red)}
.k-plain{background:var(--surface-2);color:var(--muted)}
.k-eat{background:transparent;border:1px solid var(--c-food);color:var(--c-food)}
.k-live{background:transparent;border:1px solid var(--c-music);color:var(--c-music)}
.mini{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.mini>div{background:var(--surface);padding:9px 12px;display:flex;gap:10px;align-items:baseline;cursor:pointer;border-left:4px solid var(--line)}
.mini .t-music{border-left-color:var(--c-music)} .mini .t-culture{border-left-color:var(--c-culture)}
.mini .t-market{border-left-color:var(--c-market)} .mini .t-food{border-left-color:var(--c-food)}
.mini .t-sport{border-left-color:var(--c-sport)} .mini .t-demo{border-left-color:var(--c-demo)}
.mini .t-nature{border-left-color:var(--c-nature)}
.mini .w{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);flex:none;min-width:56px}
.mini .nm{font-size:13.3px;line-height:1.35;flex:1;min-width:0}
.mini .d{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{display:inline-flex;align-items:center;gap:7px;text-decoration:none;cursor:pointer;padding:10px 15px;border-radius:999px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.act.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:400;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;color:var(--muted);font-size:13.5px;display:none;text-align:center}
.empty.on{display:block}
</style>
</head>

<div class="top">
  <div class="r1">
    <div>
      <h1 id="ttl">Mapa akcí</h1>
      <div class="sub" id="sub">Praha a okolí</div>
    </div>
    <span class="spacer"></span>
    <a class="iconbtn" id="listBtn" href="https://claude.ai/code/artifact/c5b92980-d9fc-4be9-aa80-ac7c68d861a6" target="_blank" rel="noopener" aria-label="Zpět na seznam" title="Celý přehled v seznamu">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    </a>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Přepnout režim">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2M20 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>
    </button>
  </div>
  <div class="row" id="dayRow"></div>

    <span class="count" id="count"></span>
  </div>
</div>

<div id="map"></div>
<div class="empty" id="empty">Pro tuhle kombinaci filtrů tu nic není.</div>

  </div>
</div>

    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
    walk: '<svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M10.5 21.5 12 15l-3-2.6 1-5"/><path d="M10 7.4 13.5 9l2 3H19"/><path d="M9 12 5.5 13.6 4 18"/></svg>',
    ticket: '<svg viewBox="0 0 24 24"><path d="M3 9V6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5V9a3 3 0 0 0 0 6v2.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5V15a3 3 0 0 0 0-6z"/><path d="M14 5v14"/></svg>',
    link: '<svg viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7l-1.6 1.6"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 1 0 5.7 5.7l1.6-1.6"/></svg>',
    route: '<svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="5" r="2.4"/><path d="M8.4 19h6.1a3.5 3.5 0 0 0 0-7H9.5a3.5 3.5 0 0 1 0-7h6.1"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2M20 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6h.01"/></svg>',
    alert: '<svg viewBox="0 0 24 24"><path d="M12 3.5 21 20H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>',
    target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>'
  };

  function ico(t, cls) { return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[t] || '') + '</svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function cssvar(n) { return getComputedStyle(document.body).getPropertyValue(n).trim(); }
  function col(t) { return cssvar('--c-' + t) || '#888'; }

  function haversine(a, b, c, d) {
    var R = 6371, r = Math.PI / 180, dLat = (c - a) * r, dLon = (d - b) * r;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
  }
  function fmtKm(km) {
    if (isNaN(km)) return '';
    if (km < 1) return Math.round(km * 1000) + ' m';
    if (km < 10) return km.toFixed(1).replace('.', ',') + ' km';
    return Math.round(km) + ' km';
  }
  function walkNote(km) {
    if (isNaN(km)) return '';
    var m = Math.round(km / 4.7 * 60);
    if (km <= 2.5) return '≈ ' + m + ' min pěšky';
    if (km <= 6) return 'pěšky ' + m + ' min, jinak MHD';
    if (km <= 25) return 'MHD';
    return 'vlak nebo auto';
  }
  function norm(s) { return (s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function keyOf(t) { return norm(String(t).replace(/\s*[—–-]\s*[^—–-]*$/, '')); }
  function venueOf(w) { return norm(String(w).split('·')[0].split(',')[0]); }

  /* ---------- stav ---------- */
  var EV = [], activeTypes = [], activeDay = null, wantRegion = false;
  var here = [50.0865, 14.4740], hereName = 'Žižkov';
  var map, cluster, markers = [], meMarker = null, selected = null;

  var elCard = document.getElementById('card');
  var elSheet = document.getElementById('sheet');
  var elEmpty = document.getElementById('empty');
  var elCount = document.getElementById('count');

  /* ---------- světlý / tmavý ---------- */
  (function () {
    var mode = 'dark';
    try { mode = localStorage.getItem('mapa-mode') || 'dark'; } catch (e) { }
    document.body.setAttribute('data-mode', mode);
    document.getElementById('themeBtn').addEventListener('click', function () {
      mode = mode === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('mapa-mode', mode); } catch (e) { }
      document.body.setAttribute('data-mode', mode);
      document.querySelector('meta[name=theme-color]').setAttribute('content', mode === 'dark' ? '#131216' : '#F4F2ED');
      redraw();
      if (selected) showCard(selected);
    });
  })();

  /* ---------- mapa ---------- */
  map = L.map('map', { zoomControl: true, attributionControl: true, tap: true })
    .setView(here, 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, minZoom: 8,
    attribution: '&copy; přispěvatelé <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  map.zoomControl.setPosition('bottomright');

  cluster = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyDistanceMultiplier: 1.5,
    maxClusterRadius: function (z) { return z >= 15 ? 28 : z >= 13 ? 45 : 70; },
    iconCreateFunction: function (c) {
      var kids = c.getAllChildMarkers(), tally = {};
      kids.forEach(function (m) { var t = m.options.ev.type; tally[t] = (tally[t] || 0) + 1; });
      var top = Object.keys(tally).sort(function (a, b) { return tally[b] - tally[a]; })[0] || 'culture';
      var n = c.getChildCount();
      return L.divIcon({
        className: '',
        html: '<div class="cluster' + (n > 30 ? ' big' : '') + '" style="background:' + col(top) + '">' + n + '</div>',
        iconSize: [n > 30 ? 46 : 38, n > 30 ? 46 : 38]
      });
    }
  });
  map.addLayer(cluster);
  map.on('click', function () { clearSel(); });

  function pinIcon(t, sel) {
    return L.divIcon({
      className: '',
      html: '<div class="pin' + (sel ? ' sel' : '') + '">' +
        '<svg class="body" viewBox="0 0 30 38"><path d="M15 37 C11 27 2 23.5 2 15 A13 13 0 1 1 28 15 C28 23.5 19 27 15 37 Z" fill="' + col(t) + '" stroke="#fff" stroke-width="2.4" stroke-opacity=".9"/></svg>' +
        ico(t, 'ico') + '</div>',
      iconSize: [30, 38], iconAnchor: [15, 37], popupAnchor: [0, -34]
    });
  }

  function meIcon() { return L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }); }

  /* ---------- filtry ---------- */
  function visible() {
    return EV.filter(function (e) {
      if (wantRegion !== !!e.region) return false;
      if (activeDay && e.day !== activeDay) return false;
      if (activeTypes.length && activeTypes.indexOf(e.type) === -1) return false;
      return true;
    });
  }
  function plural(n) { return n === 1 ? '1 akce' : (n >= 2 && n <= 4 ? n + ' akce' : n + ' akcí'); }

  function redraw(fit) {
    cluster.clearLayers();
    markers = [];
    var list = visible();
    list.forEach(function (e) {
      var m = L.marker([e.lat, e.lon], { icon: pinIcon(e.type, false), ev: e, riseOnHover: true });
      m.on('click', function (ev) { L.DomEvent.stopPropagation(ev); select(e, m); });
      markers.push(m);
    });
    cluster.addLayers(markers);
    if (meMarker) meMarker.setLatLng(here); else meMarker = L.marker(here, { icon: meIcon(), zIndexOffset: -100, interactive: false }).addTo(map);
    elCount.textContent = plural(list.length);
    elEmpty.classList.toggle('on', list.length === 0);
    if (selected && list.indexOf(selected) === -1) clearSel();
    if (fit && list.length) {
      var b = L.latLngBounds(list.map(function (e) { return [e.lat, e.lon]; }));
      b.extend(here);
      map.fitBounds(b.pad(0.12), { animate: false });
    }
  }

  function buildChips() {
    var days = [], seen = {};
    EV.forEach(function (e) { if (e.day && !seen[e.day]) { seen[e.day] = 1; days.push(e.day); } });
    var dr = document.getElementById('dayRow');
    days.forEach(function (d, i) {
      var p = d.split(' ');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'daytab' + (i === 0 ? ' today' : '');
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = esc(p[0]) + (p[1] ? '<span class="num">' + esc(p[1]) + '</span>' : '');
      b.onclick = function () {
        activeDay = activeDay === d ? null : d;
        dr.querySelectorAll('.daytab').forEach(function (x, j) { x.setAttribute('aria-pressed', days[j] === activeDay ? 'true' : 'false'); });
        redraw(true);
      };
      dr.appendChild(b);
    });

    var tr = document.getElementById('typeRow');
    TYPES.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.setAttribute('data-t', t); b.setAttribute('aria-pressed', 'false');
      b.innerHTML = ico(t) + esc(LABEL[t]);
      b.onclick = function () {
        var on = b.getAttribute('aria-pressed') === 'true';
        b.setAttribute('aria-pressed', on ? 'false' : 'true');
        activeTypes = on ? activeTypes.filter(function (x) { return x !== t; }) : activeTypes.concat([t]);
        redraw(true);
      };
      tr.appendChild(b);
    });

    var sel = document.getElementById('origin');
    ORIGINS.forEach(function (g) {
      var og = document.createElement('optgroup'); og.label = g[0];
      g[1].forEach(function (o) {
        var op = document.createElement('option');
        op.value = o[1] + ',' + o[2]; op.textContent = o[0];
        og.appendChild(op);
      });
      sel.appendChild(og);
    });
    sel.value = here[0] + ',' + here[1];
    sel.onchange = function () {
      var p = sel.value.split(',');
      here = [parseFloat(p[0]), parseFloat(p[1])];
      hereName = sel.options[sel.selectedIndex].textContent;
      redraw(); map.panTo(here);
      if (selected) showCard(selected);
    };

    document.getElementById('regionBtn').onclick = function () {
      wantRegion = !wantRegion;
      this.setAttribute('aria-pressed', wantRegion ? 'true' : 'false');
      document.getElementById('sub').textContent = wantRegion ? 'Okolí do 50 km' : 'Praha a okolí';
      redraw(true);
    };
    document.getElementById('fitBtn').onclick = function () { redraw(true); };
  }

  /* ---------- výběr a karta ---------- */
  function clearSel() {
    if (selected) {
      var m = markers.filter(function (x) { return x.options.ev === selected; })[0];
      if (m) m.setIcon(pinIcon(selected.type, false));
    }
    selected = null;
    elCard.classList.remove('on');
  }
  function select(e, m) {
    clearSel();
    selected = e;
    if (m) m.setIcon(pinIcon(e.type, true));
    showCard(e);
  }
  function showCard(e) {
    var c = col(e.type);
    var km = haversine(here[0], here[1], e.lat, e.lon);
    elCard.innerHTML =
      '<div class="thumb" style="background:linear-gradient(135deg,' + c + ',color-mix(in srgb,' + c + ' 60%,#111))">' + ico(e.type) + '</div>' +
      '<div class="mc"><b>' + esc(e.title) + '</b><small>' + esc(e.where) + '</small>' +
      '<span class="meta">' + esc([e.dayName || e.day, e.time, fmtKm(km)].filter(Boolean).join(' · ')) + '</span></div>' +
      '<span class="go"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>';
    elCard.onclick = function () { openSheet(e); };
    elCard.classList.add('on');
  }

  /* ---------- detail ---------- */
  function priceTags(e) {
    return (e.tags || []).filter(function (t) {
      return t.k === 'plain' && /Kč|zdarma|Zdarma|Vyprodáno|Vstupné|Vstupenky|Předprodej|vstupné|lístky|Dobrovoln/.test(t.s);
    }).map(function (t) { return t.s; });
  }
  function miniRow(x, showDay) {
    var km = haversine(here[0], here[1], x.lat, x.lon);
    return '<div class="t-' + x.type + '" data-goto="' + x.i + '">' +
      '<span class="w">' + esc((showDay && x.day ? x.day + ' ' : '') + x.time) + '</span>' +
      '<span class="nm">' + esc(x.title) + '</span>' +
      '<span class="d">' + esc(fmtKm(km)) + '</span></div>';
  }

  function openSheet(e) {
    var c = col(e.type), km = haversine(here[0], here[1], e.lat, e.lon);
    var hero = document.getElementById('hero');
    hero.style.background = 'linear-gradient(155deg,' + c + ' 0%, color-mix(in srgb,' + c + ' 68%, #101218) 100%)';
    hero.innerHTML = '<div class="glyph">' + ico(e.type) + '</div><div class="veil"></div>' +
      '<div class="ht"><span class="kicker">' + ico(e.type) + esc(LABEL[e.type]) + (e.region ? ' · do 50 km' : '') +
      ((e.tags || []).some(function (t) { return t.k === 'local'; }) ? ' · Žižkov' : '') + '</span>' +
      '<h2>' + esc(e.title) + '</h2></div>';

    var prices = priceTags(e);
    document.getElementById('quick').innerHTML =
      '<div class="qi"><b>Kdy</b><span>' + esc(e.time) + '</span><small>' + esc([e.dayName, e.dayDate].filter(Boolean).join(' · ')) + '</small></div>' +
      '<div class="qi"><b>Daleko</b><span>' + esc(fmtKm(km)) + '</span><small>' + esc(walkNote(km)) + '</small></div>' +
      '<div class="qi"><b>Vstupné</b><span>' + esc(prices.length ? prices[0] : '—') + '</span><small>' + esc(prices.length > 1 ? prices.slice(1).join(' · ') : (prices.length ? '' : 'pořadatel neuvádí')) + '</small></div>';

    var h = '';
    if (e.desc || (e.tags || []).length) {
      h += '<div class="sec">';
      if (e.desc) h += '<p class="desc">' + esc(e.desc) + '</p>';
      if ((e.tags || []).length) h += '<div class="tags">' + e.tags.map(function (t) {
        return '<span class="tag k-' + t.k + '">' + (ICON[t.k] ? ico(t.k) : '') + esc(t.s) + '</span>';
      }).join('') + '</div>';
      h += '</div>';
    }

    h += '<div class="sec"><h3>Kde a jak se tam dostat</h3>';
    h += '<div class="fact">' + F.pin + '<div>' + esc(e.where) + '</div></div>';
    h += '<div class="fact">' + F.walk + '<div>' + esc(fmtKm(km)) + ' vzdušnou čarou od bodu „' + esc(hereName) + '"<div class="sub">' + esc(walkNote(km)) + '</div></div></div>';
    if (e.doprava) h += '<div class="fact">' + F.route + '<div>' + esc(e.doprava) + '</div></div>';
    if (e.note) h += '<div class="fact">' + F.clock + '<div>' + esc(e.note) + '</div></div>';
    if (e.dayNote) h += '<div class="fact">' + F.sun + '<div>Počasí toho dne: ' + esc(e.dayNote) + '</div></div>';
    h += '</div>';

    var eat = (e.tags || []).filter(function (t) { return t.k === 'eat'; });
    var live = (e.tags || []).filter(function (t) { return t.k === 'live'; });
    if (prices.length || eat.length || live.length || e.vstupne) {
      h += '<div class="sec"><h3>Vstupné a co je na místě</h3>';
      h += '<div class="fact">' + F.ticket + '<div>' + esc(e.vstupne || prices.join(' · ') || 'pořadatel neuvádí') + '</div></div>';
      eat.forEach(function (t) { h += '<div class="fact">' + ico('food') + '<div>Najíst a napít se: ' + esc(t.s) + '</div></div>'; });
      live.forEach(function (t) { h += '<div class="fact">' + ico('music') + '<div>Hudba na místě: ' + esc(t.s) + '</div></div>'; });
      h += '</div>';
    }
    if (e.tip || e.pozor) {
      h += '<div class="sec"><h3>Dobré vědět</h3>';
      if (e.tip) h += '<div class="fact">' + F.info + '<div>' + esc(e.tip) + '</div></div>';
      if (e.pozor) h += '<div class="fact">' + F.alert + '<div>' + esc(e.pozor) + '</div></div>';
      h += '</div>';
    }

    var same = EV.filter(function (x) { return x !== e && x.key && x.key === e.key; });
    if (same.length) h += '<div class="sec"><h3>Koná se i jindy</h3><div class="mini">' + same.slice(0, 6).map(function (x) { return miniRow(x, true); }).join('') + '</div></div>';

    var venue = EV.filter(function (x) { return x !== e && x.venue && x.venue === e.venue && x.key !== e.key; });
    if (venue.length) h += '<div class="sec"><h3>Na stejném místě tenhle týden</h3><div class="mini">' + venue.slice(0, 6).map(function (x) { return miniRow(x, true); }).join('') + '</div></div>';

    var listed = {}; same.concat(venue).forEach(function (x) { listed[x.i] = 1; });
    var near = EV.filter(function (x) { return x !== e && !listed[x.i] && x.day === e.day && x.region === e.region && x.key !== e.key; })
      .map(function (x) { return { x: x, km: haversine(e.lat, e.lon, x.lat, x.lon) }; })
      .filter(function (o) { return o.km <= (e.region ? 15 : 1.6); })
      .sort(function (a, b) { return a.km - b.km; }).slice(0, 6);
    if (near.length) {
      h += '<div class="sec"><h3>Poblíž ten samý den</h3><div class="mini">' + near.map(function (o) {
        return '<div class="t-' + o.x.type + '" data-goto="' + o.x.i + '"><span class="w">' + esc(o.x.time) + '</span>' +
          '<span class="nm">' + esc(o.x.title) + '</span><span class="d">' + esc(fmtKm(o.km)) + '</span></div>';
      }).join('') + '</div><p class="note">Vzdálenost je od téhle akce, ne od tebe.</p></div>';
    }

    var acts = '';
    if (e.href) acts += '<a class="act primary" target="_blank" rel="noopener" href="' + esc(e.href) + '">' + F.link + 'Stránka pořadatele</a>';
    acts += '<button class="act" type="button" data-zoom="' + e.i + '">' + F.target + 'Přiblížit na mapě</button>';
    acts += '<a class="act" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=' + here[0] + ',' + here[1] + '&destination=' + e.lat + ',' + e.lon + '&travelmode=transit">' + F.route + 'Spojení MHD</a>';
    acts += '<a class="act" target="_blank" rel="noopener" href="https://mapy.com/zakladni?q=' + e.lat + '%2C' + e.lon + '&z=17">' + F.pin + 'Mapy.com</a>';
    h += '<div class="acts">' + acts + '</div>';
    h += '<p class="note">Vzdálenosti jsou vzdušnou čarou od bodu vybraného nahoře. Časy a vstupné se mění — u placených akcí si dostupnost ověř u pořadatele.</p>';

    document.getElementById('sbody').innerHTML = h;
    elSheet.querySelector('.sheetbox').scrollTop = 0;
    elSheet.classList.add('open');
    requestAnimationFrame(function () { elSheet.classList.add('on'); });
  }
  function closeSheet() {
    elSheet.classList.remove('on');
    setTimeout(function () { elSheet.classList.remove('open'); }, 220);
  }
  elSheet.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-close]')) { closeSheet(); return; }
    var g = ev.target.closest('[data-goto]');
    if (g) { var e = EV[+g.getAttribute('data-goto')]; focus(e); openSheet(e); return; }
    var z = ev.target.closest('[data-zoom]');
    if (z) { focus(EV[+z.getAttribute('data-zoom')]); closeSheet(); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeSheet(); });

  function focus(e) {
    if (e.region !== wantRegion) {
      wantRegion = e.region;
      var rb = document.getElementById('regionBtn');
      rb.setAttribute('aria-pressed', wantRegion ? 'true' : 'false');
      document.getElementById('sub').textContent = wantRegion ? 'Okolí do 50 km' : 'Praha a okolí';
    }
    if (activeDay && activeDay !== e.day) {
      activeDay = null;
      document.querySelectorAll('.daytab').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
    }
    if (activeTypes.length && activeTypes.indexOf(e.type) === -1) {
      activeTypes = [];
      document.querySelectorAll('.chip[data-t]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
    }
    redraw();
    var m = markers.filter(function (x) { return x.options.ev === e; })[0];
    if (!m) return;
    map.setView([e.lat, e.lon], Math.max(map.getZoom(), 16), { animate: true });
    cluster.zoomToShowLayer(m, function () { select(e, m); });
  }

  /* ---------- start ---------- */
  function boot(d) {
    EV = (d.events || []).filter(function (e) { return e.lat != null && e.lon != null; });
    EV.forEach(function (e, i) { e.i = i; e.key = keyOf(e.title); e.venue = venueOf(e.where); });
    if (d.meta) {
      document.getElementById('ttl').textContent = d.meta.title || 'Mapa akcí';
      document.title = (d.meta.title || 'Mapa akcí') + ' — mapa';
      document.getElementById('sub').textContent = 'Praha a okolí · ' + (d.meta.range || '');
    }
    buildChips();
    redraw(true);
  }

  if (window.__DATA__) {
    boot(window.__DATA__);
  } else {
    fetch('data.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(boot).catch(function (err) {
      document.getElementById('empty').textContent = 'Data se nepodařilo načíst.';
      document.getElementById('empty').classList.add('on');
      console.error(err);
    });
  }
})();

</script>
</body>
</html>
